<text x="40" y="622" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12" fill="#4f5d75">화살표 번호 = open-questions.md §0.1 표의 행 번호(#). 점선 상자는 여러 상태를 묶은 것이다: 9·11은 실행 중·QA·검증 어느 쪽에서든 나가고,</text>
<text x="40" y="648" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12" fill="#4f5d75">10은 중단된 단계(실행/QA/검증)로, 12는 실패한 단계로 새 시도와 함께 돌아간다. 15는 계획 중·승인 대기·실행 대기에서 CP 취소(실행 이력 없을 때만).</text>
<text x="40" y="674" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12" fill="#4f5d75">2 = 명세 완료 → 착수 승인 요청.  4 = 팀장 시작 + 선행·자원·설치 통과.  5 = ① 통과: 개발 → QA 진행(qa) / 재작업 → 검증 진행(verifying).</text>
<text x="40" y="700" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12" fill="#4f5d75">6 = PASS → Gate 대기 / FAIL → 재작업 필요.  7 = BLOCKED는 상태 유지 → 원인 해결 후 새 검증 시도.</text>
<text x="40" y="726" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12" fill="#4f5d75">8 = 자동(최대 3회), 이후 버튼.  10 = 재개 버튼 + 보유 해제 확인, 새 시도·같은 등급(모델 허용 해제 시 D-29).  12 = 자동 재시도 최대 2회(총 3회), 이후 버튼.</text>
<text x="40" y="752" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12" fill="#4f5d75">13 = Gate 5조건 + ② + 병합 확인 → 완료(자동).  14 = ② 실패·병합 충돌 → 재작업 필요 / 검증한 코드·명세 변경 → 검증 진행.</text>
<text x="40" y="778" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12" fill="#4f5d75">완료·취소됨은 종료 상태, 「차단」은 상태가 아니라 계산값. ① = Task 검사, ② = 통합 확인.</text>
</svg>
