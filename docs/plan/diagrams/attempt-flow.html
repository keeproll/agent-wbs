<text x="40" y="604" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12" fill="#4f5d75">출처: contracts.md §4.1. claim은 예약만 하고 시도를 만들지 않는다. 하위 Agent 설치에 성공한 뒤 jobs/start가 시도를 만들고 Task를 전이한다.</text>
<text x="40" y="630" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12" fill="#4f5d75">CLI가 끝나면 물리 슬롯만 반환하고 Task·충돌 묶음 잠금은 유지한다. ① 실패 시 slots/acquire → 같은 시도에서 CLI 수정 → slots/release → ① 반복.</text>
<text x="40" y="656" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12" fill="#4f5d75">QA PASS → gate → (② 외 Gate 5조건 충족) integrate → ② 통과 → PR 병합(strict 보호 + sha=H&#x27;, merge_method=merge) → ci/queue merged</text>
<text x="40" y="682" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12" fill="#4f5d75">→ 서버 Gate 재판정(검사한 병합본과 실제 병합 일치 확인) → done. 별도 완료 승인 없음(owner Q-02).</text>
<text x="40" y="708" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12" fill="#4f5d75">H&#x27; = QA한 head H에 main A를 충돌 없이 합친 커밋(H가 A를 포함하면 H&#x27;=H). ①과 ②는 H&#x27;에서 다시 실행한다.</text>
