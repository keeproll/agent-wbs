# Agent WBS web(M8-06). 화면 파일을 내보내고 /api·/health 요청은 같은 네트워크 공간의 API(127.0.0.1:3100)로 넘긴다.
# api 컨테이너는 이 컨테이너의 네트워크 공간을 같이 쓴다(compose.prod.yaml의 network_mode). 그래서 API는 127.0.0.1에서만 듣는다.
# 왜: API가 loopback(같은 PC 안의 연결)에서만 들으면 LAN 공개 규칙(추측 가능한 날짜 PIN)을 켜지 않고 개발 때와 같은 보안 규칙을 쓴다.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # 증거·PDF 업로드보다 넉넉하게 둔다(Runner 증거 파일 최대 50 MiB, agent-runner/README.md).
    client_max_body_size 64m;

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        # Host·Origin은 브라우저가 보낸 값을 그대로 넘긴다. API가 Origin을 AWBS_ORIGIN과 비교한다.
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location = /health { proxy_pass http://127.0.0.1:3100; }
    location = /health/db { proxy_pass http://127.0.0.1:3100; }

    # 화면 주소(/projects/... 등)는 모두 index.html로 돌려준다(화면 안에서 경로를 처리한다).
    location / {
        try_files $uri /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
